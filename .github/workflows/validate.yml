name: Validate English Repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Check repository names and text
        run: python3 scripts/check_english.py
